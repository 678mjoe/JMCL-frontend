name: Quality and native packaging

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.4.4
  RUST_VERSION: 1.99.1
  CORE_REVISION: 5a4310debbcee26b3d2391bab2339f79cd6ec52e

jobs:
  frontend:
    # No private-repository billable execution or larger/paid runners.
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: python scripts/test-verify-ci-package.py
      - run: bun run test
      - run: bun run build
      - run: bunx --no-install playwright install --with-deps chromium
      - run: bun run test:e2e

  native:
    # Standard public-repository runners only. No release artifacts are uploaded.
    if: github.event.repository.visibility == 'public'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundle: deb
          - os: macos-15
            target: aarch64-apple-darwin
            bundle: dmg
          - os: macos-15-intel
            target: x86_64-apple-darwin
            bundle: dmg
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            bundle: nsis
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: 678mjoe/JMCLCore
          ref: ${{ env.CORE_REVISION }}
          path: .ci-core
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libwebkit2gtk-4.1-dev build-essential libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Select pinned Rust (official rustup verifies distribution checksums)
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt
          rustup default "$RUST_VERSION"
          test "$(rustc -Vv | sed -n 's/^host: //p' | tr -d '\r')" = '${{ matrix.target }}'
      - name: Install checksum-pinned official Zig
        run: python scripts/setup-ci-zig.py
      - name: Build and stage matching core sidecar
        run: |
          test "$(git -C .ci-core rev-parse HEAD)" = "$CORE_REVISION"
          (cd .ci-core && zig build -Doptimize=ReleaseSafe)
          mkdir -p backend-binaries
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cp .ci-core/zig-out/bin/jmcl-core.exe backend-binaries/jmcl-core.exe
            bash scripts/prepare-sidecar.sh backend-binaries/jmcl-core.exe
          else
            cp .ci-core/zig-out/bin/jmcl-core backend-binaries/jmcl-core
            bash scripts/prepare-sidecar.sh backend-binaries/jmcl-core
          fi
      - run: bun install --frozen-lockfile
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - run: cargo check --locked --manifest-path src-tauri/Cargo.toml
      - name: Rust unit and isolated local RPC tests (not real services)
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Typed account wrappers against real Core (synthetic metadata only)
        run: |
          bun scripts/test-account-core.ts
          bun scripts/test-capabilities-core.ts
      # Debug reuses the test/check profile. These packages never leave the runner.
      # --no-sign skips bundler signing; no identities, secrets or release services.
      - name: Generate non-distributed debug package without code signing
        run: bun run tauri build --debug --ci --no-sign --bundles '${{ matrix.bundle }}'
      - name: Inspect package metadata, architecture and pinned sidecar (no installation)
        run: python scripts/verify-ci-package.py --target '${{ matrix.target }}'
