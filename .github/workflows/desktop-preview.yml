name: Desktop preview packages

on:
  push:
    branches: [build/ui-preview-modpack-20261120]
    paths: ['.github/workflows/desktop-preview.yml', 'scripts/verify-preview-package.py']

permissions:
  contents: read

concurrency:
  group: desktop-preview-${{ github.ref }}
  cancel-in-progress: false

env:
  BUN_VERSION: 1.4.4
  RUST_VERSION: 1.99.1
  CORE_REVISION: 5a4310debbcee26b3d2391bab2339f79cd6ec52e

jobs:
  native:
    # Unsigned user-requested previews, not a release or updater publication.
    if: github.event.repository.visibility == 'public' && github.ref == 'refs/heads/build/ui-preview-modpack-20261120'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            bundle: app
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            bundle: nsis
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Preserve committed LF bytes on disposable runner
        run: git config --global core.autocrlf false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: 678mjoe/JMCLCore
          ref: ${{ env.CORE_REVISION }}
          path: .ci-core
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Select pinned Rust (official rustup verifies distribution checksums)
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt
          rustup default "$RUST_VERSION"
          test "$(rustc -Vv | sed -n 's/^host: //p' | tr -d '\r')" = '${{ matrix.target }}'
      - name: Install checksum-pinned official Zig
        run: python scripts/setup-ci-zig.py
      - name: Build and stage matching core sidecar
        run: |
          test "$(git -C .ci-core rev-parse HEAD)" = "$CORE_REVISION"
          (cd .ci-core && zig build -Doptimize=ReleaseSafe)
          mkdir -p backend-binaries
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cp .ci-core/zig-out/bin/jmcl-core.exe backend-binaries/jmcl-core.exe
            bash scripts/prepare-sidecar.sh backend-binaries/jmcl-core.exe
          else
            cp .ci-core/zig-out/bin/jmcl-core backend-binaries/jmcl-core
            bash scripts/prepare-sidecar.sh backend-binaries/jmcl-core
          fi
      - run: bun install --frozen-lockfile
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - run: cargo check --locked --manifest-path src-tauri/Cargo.toml
      - name: Rust unit and isolated local RPC tests (not real services)
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: bun run test
      - name: Build unsigned complete desktop preview
        run: bun run tauri build --ci --no-sign --bundles '${{ matrix.bundle }}'
      - name: Verify packaged architecture, exact sidecar and Core version RPC
        run: python scripts/verify-preview-package.py --target '${{ matrix.target }}' --profile release --macos-format app --smoke-core --output-dir packaged-preview
      - name: Preserve UI provenance and asset licensing
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, shutil, subprocess
          root = pathlib.Path('.')
          source = '83e3fa749c56af79d1760b9e85c277d84286ca19'
          # Only the packaging workflow and package verifier may differ from the UI source.
          parent = subprocess.check_output(['git','rev-parse','HEAD^'], text=True).strip()
          assert parent == source, (parent, source)
          changed = subprocess.check_output(['git','diff-tree','--no-commit-id','--name-only','-r','HEAD'], text=True).splitlines()
          assert set(changed) == {'.github/workflows/desktop-preview.yml','scripts/verify-preview-package.py'}, changed
          out = root / 'packaged-preview'
          assets = {}
          for name in ['jmcl-feature-andesite.png', 'jmcl-feature-andesite.LICENSE.txt']:
              original = root / 'public' / name
              built = root / 'dist' / name
              assert original.read_bytes() == built.read_bytes(), name
              assets[name] = hashlib.sha256(built.read_bytes()).hexdigest()
          shutil.copy2(root / 'public/jmcl-feature-andesite.LICENSE.txt', out)
          shutil.copy2(root / 'LICENSE', out / 'JMCL-LICENSE.txt')
          font_license = root / 'node_modules/@fontsource-variable/inter/LICENSE'
          assert font_license.is_file(), 'Missing bundled Inter font license'
          shutil.copy2(font_license, out / 'Inter-LICENSE.txt')
          manifest = json.loads((out / 'manifest.json').read_text())
          manifest.update(ui_source_revision=source, ui_source_branch='ui-redesign',
                          packaging_only_changes=changed, bundled_assets_sha256=assets)
          (out / 'manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          PY
      - name: Upload requested preview package and provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: jmcl-desktop-${{ matrix.target }}-${{ github.sha }}
          path: packaged-preview/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
