name: Desktop preview packages

on:
  push:
    branches: [build/desktop-sidecar-preview]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-preview-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.4.4
  RUST_VERSION: 1.99.1
  CORE_REVISION: 5a4310debbcee26b3d2391bab2339f79cd6ec52e

jobs:
  native:
    # Unsigned user-requested previews, not a release or updater publication.
    if: github.event.repository.visibility == 'public'
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            bundle: dmg
          - os: macos-15-intel
            target: x86_64-apple-darwin
            bundle: dmg
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            bundle: nsis
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: 678mjoe/JMCLCore
          ref: ${{ env.CORE_REVISION }}
          path: .ci-core
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Select pinned Rust (official rustup verifies distribution checksums)
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt
          rustup default "$RUST_VERSION"
          test "$(rustc -Vv | sed -n 's/^host: //p' | tr -d '\r')" = '${{ matrix.target }}'
      - name: Install checksum-pinned official Zig
        run: python scripts/setup-ci-zig.py
      - name: Build and stage matching core sidecar
        run: |
          test "$(git -C .ci-core rev-parse HEAD)" = "$CORE_REVISION"
          (cd .ci-core && zig build -Doptimize=ReleaseSafe)
          mkdir -p backend-binaries
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cp .ci-core/zig-out/bin/jmcl-core.exe backend-binaries/jmcl-core.exe
            bash scripts/prepare-sidecar.sh backend-binaries/jmcl-core.exe
          else
            cp .ci-core/zig-out/bin/jmcl-core backend-binaries/jmcl-core
            bash scripts/prepare-sidecar.sh backend-binaries/jmcl-core
          fi
      - run: bun install --frozen-lockfile
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - run: cargo check --locked --manifest-path src-tauri/Cargo.toml
      - name: Rust unit and isolated local RPC tests (not real services)
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: bun run test
      - name: Build unsigned complete desktop preview
        run: bun run tauri build --ci --no-sign --bundles '${{ matrix.bundle }}'
      - name: Verify packaged architecture, exact sidecar and Core version RPC
        run: python scripts/verify-ci-package.py --target '${{ matrix.target }}' --profile release --smoke-core --output-dir packaged-preview
      - name: Upload requested preview package and provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: jmcl-desktop-${{ matrix.target }}-${{ github.sha }}
          path: packaged-preview/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
